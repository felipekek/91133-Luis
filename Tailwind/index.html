<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script> 
  <title>Lage Page com tailwindcss</title>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

  <header class="bg-gray-800 shadow">
    <nav class="container mx-auto p-4">
      <ul class="flex justify-center space-x-8 text-gray-300">
        <li><a href="#" class="hover:text-white transition">Home</a></li>
        <li><a href="#" class="hover:text-white transition">Sobre Nós</a></li>
        <li><a href="#" class="hover:text-white transition">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main class="container mx-auto py-12 px-4 space-y-16">

    <section>
      <h2 class="text-3xl font-semibold mb-4 text-blue-400">Nossa História</h2>
      <p class="text-gray-300 text-lg">Aqui vai um breve texto sobre a trajetória ou missão da empresa ou projeto.</p>
    </section>

    <section>
      <h2 class="text-3xl font-semibold mb-4 text-blue-400">Nossa Equipe</h2>
      <img src="/Tailwind/img/equipe.jpg" alt="Equipe" class="w-full max-w-md rounded-lg shadow mx-auto">
    </section>

    <section>
      <h2 class="text-3xl font-semibold mb-4 text-blue-400">Parceiros</h2>
      <table class="w-full table-auto border border-gray-700 text-gray-200">
        <thead class="bg-gray-700">
          <tr>
            <th class="px-4 py-2 border border-gray-600">Nome</th>
            <th class="px-4 py-2 border border-gray-600">Setor</th>
          </tr>
        </thead>
        <tbody>
          <tr class="bg-gray-800">
            <td class="px-4 py-2 border border-gray-700">Amendo Bobo</td>
            <td class="px-4 py-2 border border-gray-700">Tecnologia</td>
          </tr>
          <tr class="bg-gray-800">
            <td class="px-4 py-2 border border-gray-700">Bobo bobo Amendo Bobo</td>
            <td class="px-4 py-2 border border-gray-700">Marketing</td>
          </tr>
        </tbody>
      </table>
    </section>
    
  </main>

  <footer class="bg-gray-800 py-6 mt-12">
    <div class="text-center text-gray-400">
      &copy; 2025 Marca Genérica. Todos os direitos reservados.
    </div>
  </footer>

</body>
</html>
