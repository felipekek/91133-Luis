<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Contato</title>
</head>

<body class="bg-gray-900 text-gray-100 font-sans">

  <header class="bg-gray-800 shadow">
    <nav class="container mx-auto p-4">
      <ul class="flex justify-center space-x-8 text-gray-300">
        <li><a href="index.html" class="hover:text-white transition">Home</a></li>
        <li><a href="sobre.html" class="hover:text-white transition">Sobre Nós</a></li>
        <li><a href="contato.html" class="hover:text-white transition">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main class="container mx-auto py-12 px-4">
    <section class="bg-gray-800 p-6 rounded-lg shadow">
      <h2 class="text-2xl font-semibold mb-4 text-blue-400">Entre em Contato</h2>
      <form action="#" method="POST" class="space-y-4">
        <div>
          <label for="name" class="block text-gray-300">Nome</label>
          <input type="text" id="name" name="name" class="w-full p-3 bg-gray-700 rounded-md text-gray-200" required>
        </div>
        <div>
          <label for="email" class="block text-gray-300">Email</label>
          <input type="email" id="email" name="email" class="w-full p-3 bg-gray-700 rounded-md text-gray-200" required>
        </div>
        <div>
          <label for="message" class="block text-gray-300">Mensagem</label>
          <textarea id="message" name="message" class="w-full p-3 bg-gray-700 rounded-md text-gray-200" rows="4" required></textarea>
        </div>
        <button type="submit" class="w-full py-3 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition">Enviar</button>
      </form>
    </section>
  </main>

  <footer class="bg-gray-800 py-6 mt-12">
    <div class="text-center text-gray-400">
      &copy; 2025 Marca Genérica. Todos os direitos reservados.
    </div>
  </footer>

</body>
</html>
