<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel</title>
    
</head>
<body>
    <h1>Bem-vindo(a) ao Painel!</h1>
    <p id="userWelcome"> Carregando...</p>

    <!-- Botão para sair-->
    <button id="logouBtn"> Sair</button>

    <script>
        // Recupera o nome da usuario do local localStorage
        const username = localStorage.getItem("username");

        if(username) {
            document.getElementById("userWelcome").textContent = `Bem-vindo(a), ${(username)}!`;
        }else{    
            document.getElementById("userWelcome").textContent = "Nome de usuário não encontrado.";
        }

        //função para sair(destruir a sessão e voltar para o login)
        document.getElementById("logouBtn").addEventListener("click",function(){
        //Remove o nome de usuário do localStorage
        localStorage.removeItem("username");
        //Redireciona o usua
        window.location.href = "validacao.html";
});
    </script>
  
</body>

</html>
