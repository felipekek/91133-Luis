
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de Estoque 1.0 - SENAI FSA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Controle de Estoque 1.0 - SENAI FSA</h1>

    <form method="post" action="api/api.php" onsubmit="return validarFormulario()">
        <label for="produto">Produto:</label>
        <input type="text" id="produto" name="produto">

        <label for="tipo">Tipo:</label>
        <input type="tipo" name="tipo">
        <select id="tipo" name="tipo">
            <option value="">Selecione</option>
            <option value="Alimento">Alimento</option>
            <option value="Limpeza">Limpeza</option>
            <option value="Eletrônico">Eletrônico</option>
            <option value="Vestuário">Vestuário</option>
    </select>

    <label for="quantidade">Quantidade:</label>
    <input type="number" id="quantidade" name="quantidade">

    <button type="submit">Cadastrar</button>
    </form>
    <div>
        <button class="btn"><a href="">Listar produtos</a></button>
        <br> <button class="btn" ><a href="">Voltar</a></button>
    </div>

    <script src="script.js"></script>
</body>
</html>
